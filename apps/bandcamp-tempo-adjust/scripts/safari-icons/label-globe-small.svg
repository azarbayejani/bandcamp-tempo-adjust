<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Stand-in for the app icon's label-globe layer at toolbar size: the full
       globe turns to grey mesh at 34px, so this keeps only the meridian,
       equator and axis, drawn thicker. Same canvas and label position. -->
  <g transform="rotate(-20 340 512)" fill="none" stroke="#1C1C1E" stroke-width="30" stroke-linecap="round">
    <ellipse cx="340" cy="512" rx="96" ry="160"/>
    <path d="M180 512 H500 M340 352 V672"/>
  </g>
  <circle cx="340" cy="512" r="28" fill="#000000"/>
</svg>
