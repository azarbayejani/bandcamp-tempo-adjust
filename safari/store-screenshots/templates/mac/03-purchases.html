    <div class="scale" style="--pos:0" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(420px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(420px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(420px + (0) * var(--unit))">0</span><span class="label" style="top:calc(420px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(420px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
