<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Master Tempo (Mac)</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="mac.css" />
</head>
<body class="light">
    <div class="scale" style="--pos:-8.5" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(420px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(420px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(420px + (0) * var(--unit))">0</span><span class="label" style="top:calc(420px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(420px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="copy">
      <h1>Move the tempo.<br />Keep the <mark>key</mark>.</h1>
      <p>Master Tempo holds the pitch while the speed changes. Ranges from ±6 to wide, like a deck.</p>
    </div>
    <!-- master-tempo.png is 2632×1766 with its shadow margin: the hero's
         window scrolled past the page header, with ±16 and Master Tempo on
         and the fader at −8.5%. At 0.5 like the hero, the panel sits at
         mid-canvas and the art stays whole inside the right edge. -->
    <img class="window" src="../../public/screenshots/mac/master-tempo.png" alt="" style="left:190px; top:330px; width:1316px" />
</body>
</html>
