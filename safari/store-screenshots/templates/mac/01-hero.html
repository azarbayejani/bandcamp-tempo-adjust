<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hero (Mac)</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="mac.css" />
  <style>
    /* The period stays on the tape rather than wrapping alone. */
    .nowrap { white-space: nowrap; }
  </style>
</head>
<body class="dark">
    <div class="scale" style="--pos:6.9" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(420px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(420px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(420px + (0) * var(--unit))">0</span><span class="label" style="top:calc(420px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(420px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="copy">
      <h1>Hear tracks at<br /><span class="nowrap"><mark>your tempo</mark>.</span></h1>
      <p>A pitch fader and BPM detection for Bandcamp, right inside Safari.</p>
    </div>
    <!-- tralbum-page.png is 2614×2122 with its shadow margin, a ~1190pt
         window: an album page at its top, the fader at +6.9% with a
         detected BPM showing. At 0.5 (1:1 with the screen) it spans the
         frame under the headline and runs off the bottom; the art stays
         whole. -->
    <img class="window" src="../../public/screenshots/mac/tralbum-page.png" alt="" style="left:222px; top:330px; width:1307px" />
</body>
</html>
