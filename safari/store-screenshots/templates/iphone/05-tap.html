<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tap BPM</title>
  <link rel="stylesheet" href="../shared.css" />
</head>
<body class="dark">
    <div class="scale" style="--pos:0" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(438px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(438px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(438px + (0) * var(--unit))">0</span><span class="label" style="top:calc(438px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(438px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="copy">
      <h1><mark>Tap</mark> the tempo in yourself.</h1>
      <p>Detector wrong? Tap along with the beat, then nudge, halve or double it.</p>
    </div>
    <div class="phone" style="top:250px">
      <div class="screen">
        <!-- tap.png is the test's bc-tap: the Tap BPM screen, eight taps in. -->
        <div class="page"><img src="../../public/screenshots/iphone/tap.png" alt="" /></div>
      </div>
    </div>
</body>
</html>
