<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>BPM detection</title>
  <link rel="stylesheet" href="../shared.css" />
</head>
<body class="light">
    <div class="scale" style="--pos:0" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(438px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(438px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(438px + (0) * var(--unit))">0</span><span class="label" style="top:calc(438px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(438px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="copy">
      <h1>Know the <mark>BPM</mark> before you buy.</h1>
      <p>One tap analyzes the playing track and writes its tempo into the tracklist.</p>
    </div>
    <div class="phone" style="top:250px">
      <div class="screen">
        <!-- bpm.png is the test's bc-detect: an unanalyzed track's Detect BPM button over a tracklist with detected BPMs. -->
        <div class="page"><img src="../../public/screenshots/iphone/bpm.png" alt="" /></div>
      </div>
    </div>
</body>
</html>
