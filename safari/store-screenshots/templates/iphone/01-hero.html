<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hero</title>
  <link rel="stylesheet" href="../shared.css" />
  <style>
    /* The period stays on the tape rather than wrapping alone. */
    .nowrap { white-space: nowrap; }
  </style>
</head>
<body class="dark">
    <div class="scale" style="--pos:3.7" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(438px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(438px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(438px + (0) * var(--unit))">0</span><span class="label" style="top:calc(438px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(438px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="copy">
      <h1>Hear tracks at<br /><span class="nowrap"><mark>your tempo</mark>.</span></h1>
      <p>A pitch fader for Bandcamp, right inside Safari.</p>
    </div>
    <div class="phone" style="top:250px">
      <div class="screen">
        <!-- hero.png is the test's bc-hero: a Bandcamp album page with the fader at +3.2%. -->
        <div class="page"><img src="../../public/screenshots/iphone/hero.png" alt="" /></div>
      </div>
    </div>
</body>
</html>
