<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Master tempo</title>
  <link rel="stylesheet" href="../shared.css" />
</head>
<body class="light">
    <div class="scale" style="--pos:-8.9" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(438px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(438px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(438px + (0) * var(--unit))">0</span><span class="label" style="top:calc(438px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(438px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="copy">
      <h1>Move the tempo. Keep the <mark>key</mark>.</h1>
      <p>Master Tempo keeps the pitch steady while the speed changes.</p>
    </div>
    <div class="phone" style="top:250px">
      <div class="screen">
        <!-- master-tempo.png is the test's bc-master-tempo: Master Tempo on, fader at −8%. -->
        <div class="page"><img src="../../public/screenshots/iphone/master-tempo.png" alt="" /></div>
      </div>
    </div>
</body>
</html>
