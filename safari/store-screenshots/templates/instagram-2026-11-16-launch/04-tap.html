<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Tap BPM</title>
  <link rel="stylesheet" href="../instagram.css" />
</head>
<body class="feed">
    <div class="scale" style="--pos:-8.9" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(var(--mid) + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(var(--mid) + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(var(--mid) + (0) * var(--unit))">0</span><span class="label" style="top:calc(var(--mid) + (8) * var(--unit))">+8</span><span class="label" style="top:calc(var(--mid) + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="ghost" aria-hidden="true">TAP</div>
    <div class="kicker"><img src="../../public/screenshots/iphone/icon.png" alt="" /><span><b>Tempo Adjust</b> · for Bandcamp &amp; Discogs</span></div>
    <div class="copy">
      <h1><mark>Tap</mark> the tempo in yourself.</h1>
      <p>Detector wrong? Tap along with the beat, then nudge, halve or double it.</p>
    </div>
    <div class="phone" style="--bezel-scale:calc(290 / 1206); right:93px; top:236px">
      <div class="screen tap">
        <!-- tap.png is the test's bc-tap: the Tap BPM screen, eight taps in. -->
        <div class="page"><img src="../../public/screenshots/iphone/tap.png" alt="" /></div>
        <!-- The spotlight's rectangle is set on .screen's class in instagram.css. -->
        <div class="spot-dim"></div>
        <div class="spot"><span>Added by Tempo Adjust</span></div>
      </div>
    </div>
</body>
</html>
