<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Purchase export</title>
  <link rel="stylesheet" href="../instagram.css" />
</head>
<body class="feed">
    <div class="scale" style="--pos:0" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(var(--mid) + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(var(--mid) + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(var(--mid) + (0) * var(--unit))">0</span><span class="label" style="top:calc(var(--mid) + (8) * var(--unit))">+8</span><span class="label" style="top:calc(var(--mid) + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="ghost" aria-hidden="true">CSV</div>
    <div class="kicker"><img src="../../public/screenshots/iphone/icon.png" alt="" /><span><b>Tempo Adjust</b> · for Bandcamp &amp; Discogs</span></div>
    <div class="copy">
      <h1>See what you’ve <mark>spent</mark>.</h1>
      <p>Every Bandcamp order, totaled in your currency and saved as a CSV.</p>
    </div>
    <div class="phone" style="--bezel-scale:calc(265 / 1206); right:107px; top:236px">
      <div class="screen purchases">
        <!-- purchase-export.png is taken by hand (see README.md): the purchase exporter on the purchases page, with a real order below it that the spotlight's blur makes illegible. -->
        <div class="page"><img src="../../public/screenshots/iphone/purchase-export.png" alt="" /></div>
        <!-- The spotlight's rectangle is set on .screen's class in instagram.css. -->
        <!-- A blurred copy of the page, shown outside the spotlight, so the real order under the card is illegible. -->
        <div class="page spot-blur"><img src="../../public/screenshots/iphone/purchase-export.png" alt="" /></div>
        <div class="spot-dim"></div>
        <div class="spot"><span>Added by Tempo Adjust</span></div>
      </div>
    </div>
</body>
</html>
