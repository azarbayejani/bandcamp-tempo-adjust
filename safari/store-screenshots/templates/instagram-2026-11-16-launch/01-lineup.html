<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Every platform</title>
  <link rel="stylesheet" href="../instagram.css" />
</head>
<body class="feed lineup">
    <div class="scale" style="--pos:6.9" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(var(--mid) + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(var(--mid) + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(var(--mid) + (0) * var(--unit))">0</span><span class="label" style="top:calc(var(--mid) + (8) * var(--unit))">+8</span><span class="label" style="top:calc(var(--mid) + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="ghost" aria-hidden="true">NOW</div>
    <div class="kicker"><img src="../../public/screenshots/iphone/icon.png" alt="" /><span><b>Tempo Adjust</b> · for Bandcamp &amp; Discogs</span></div>
    <div class="copy">
      <h1>Now available for desktop, iPad and <mark>mobile</mark>.</h1>
      <p>A pitch fader for Bandcamp and Discogs, in every browser you listen in.</p>
      <ul class="chips"><li><b>Chrome</b> · Desktop</li><li><b>Firefox</b> · Desktop & Android</li><li><b>Safari</b> · iPhone, iPad & Mac</li></ul>
    </div>
    <!-- tralbum-page.png is the Mac hero capture, a ~1190pt Safari window on the album page with the fader at +6.9%, with its macOS shadow on a transparent margin. The iPad in front covers its player; its album art shows it is the same page. -->
    <img class="window" src="../../public/screenshots/mac/tralbum-page.png" alt="" style="left:150px; top:345px; width:430px" />
    <!-- hero-zoomed.png is the iPad hero capture: the same album page in Safari on the 13-inch iPad Pro, fader at +5.1%. -->
    <div class="pad" style="--screen-w:262; left:84px; top:426px"><div class="screen"><img src="../../public/screenshots/ipad/hero-zoomed.png" alt="" /></div></div>
    <div class="phone" style="--bezel-scale:calc(72 / 1206); left:46px; top:480px">
      <div class="screen">
        <!-- hero.png is the test's bc-hero: the same album page on the iPhone, fader at +3.2%. The three devices stand bottom-aligned, phone in front, like a product-family lineup. -->
        <div class="page"><img src="../../public/screenshots/iphone/hero.png" alt="" /></div>
      </div>
    </div>
</body>
</html>
