<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discogs</title>
  <link rel="stylesheet" href="../instagram.css" />
</head>
<body class="feed">
    <div class="scale" style="--pos:4.3" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(var(--mid) + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(var(--mid) + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(var(--mid) + (0) * var(--unit))">0</span><span class="label" style="top:calc(var(--mid) + (8) * var(--unit))">+8</span><span class="label" style="top:calc(var(--mid) + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="ghost" aria-hidden="true">+4.3%</div>
    <div class="kicker"><img src="../../public/screenshots/iphone/icon.png" alt="" /><span><b>Tempo Adjust</b> · for Bandcamp &amp; Discogs</span></div>
    <div class="copy">
      <h1><mark>Discogs</mark> too.</h1>
      <p>The same fader rides the video previews on every release page.</p>
    </div>
    <div class="phone" style="--bezel-scale:calc(205 / 1206); right:140px; top:236px">
      <div class="screen discogs">
        <!-- discogs.png is the test's dg-nudged: a Discogs release page with a video open, fader at +4.3%. -->
        <div class="page"><img src="../../public/screenshots/iphone/discogs.png" alt="" /></div>
        <!-- The spotlight's rectangle is set on .screen's class in instagram.css. -->
        <div class="spot-dim"></div>
        <div class="spot"><span>Added by Tempo Adjust</span></div>
      </div>
    </div>
</body>
</html>
