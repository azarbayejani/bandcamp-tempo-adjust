<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Master Tempo (iPad, landscape)</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="ipad.css" />
</head>
<body class="light">
    <div class="scale" style="--pos:-9.1" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(486px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(486px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(486px + (0) * var(--unit))">0</span><span class="label" style="top:calc(486px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(486px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="copy">
      <h1>Move the tempo.<br />Keep the <mark>key</mark>.</h1>
      <p>Master Tempo holds the pitch while the speed changes. Ranges from ±6 to wide, like a deck.</p>
    </div>
    <!-- master-tempo-zoomed.png is the hero's page with ±16 and Master
         Tempo on and the fader at −9.1%, placed like the hero. -->
    <div class="ipad" style="top:346px">
      <div class="screen">
        <div class="page"><img src="../../public/screenshots/ipad/master-tempo-zoomed.png" alt="" /></div>
      </div>
    </div>
</body>
</html>
