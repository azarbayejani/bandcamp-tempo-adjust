<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Discogs (iPad)</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="ipad.css" />
</head>
<body class="light">
    <div class="scale" style="--pos:0" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(486px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(486px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(486px + (0) * var(--unit))">0</span><span class="label" style="top:calc(486px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(486px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="copy">
      <h1><mark>Discogs</mark> too.</h1>
      <p>The same fader rides the video previews on every release page.</p>
    </div>
    <!-- discogs-landscape.png is a release page at its top, at Safari's
         normal zoom since Discogs already sets the panel large at the
         page's right, with the one video playing (the panel only mounts
         under a playing video) and the fader at 0. The iPad sits where the
         hero's does; the page is short, so the canvas ends in its blank
         space before the site footer. -->
    <div class="ipad" style="top:346px">
      <div class="screen">
        <div class="page"><img src="../../public/screenshots/ipad/discogs-landscape.png" alt="" /></div>
      </div>
    </div>
</body>
</html>
