<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>Hero (iPad, landscape)</title>
  <link rel="stylesheet" href="../shared.css" />
  <link rel="stylesheet" href="ipad.css" />
  <style>
    .nowrap { white-space: nowrap; }
  </style>
</head>
<body class="dark">
    <div class="scale" style="--pos:5.1" aria-hidden="true"><div class="ticks"></div><div class="zero"></div><span class="label" style="top:calc(486px + (-16) * var(--unit))">−16</span><span class="label" style="top:calc(486px + (-8) * var(--unit))">−8</span><span class="label" style="top:calc(486px + (0) * var(--unit))">0</span><span class="label" style="top:calc(486px + (8) * var(--unit))">+8</span><span class="label" style="top:calc(486px + (16) * var(--unit))">+16</span><div class="marker"></div></div>
    <div class="copy">
      <h1>Hear tracks at<br /><span class="nowrap"><mark>your tempo</mark>.</span></h1>
      <p>A pitch fader and BPM detection for Bandcamp, right inside Safari.</p>
    </div>
    <!-- hero-zoomed.png is a simulator screenshot of the album page on
         its side with Safari's page zoom at 150%, like the Mac captures,
         scrolled so the album title sits under the toolbar: the panel
         under the player with the fader at +5.1% and a detected BPM, the
         art beside it, and under the art the fans' avatars, blurred in
         the capture. At that zoom the page drops its right sidebar. The
         iPad starts under the subhead and runs off the bottom. -->
    <div class="ipad" style="top:346px">
      <div class="screen">
        <div class="page"><img src="../../public/screenshots/ipad/hero-zoomed.png" alt="" /></div>
      </div>
    </div>
</body>
</html>
